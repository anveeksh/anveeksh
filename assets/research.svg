  <title id="t">Research</title>
  <desc id="d">Civic A.I. Lab, Northeastern University: Graduate Student Researcher, 2026 to present. Detecting criminal recruitment and glorification content on TikTok and YouTube with multilingual datasets, classifiers, and error analysis. CACTi Lab, Northeastern University: Research Assistant, 2025 to present. Firmware, IoT, and embedded systems security, automated vulnerability discovery and security testing. AI-assisted security, Northeastern University: Research Apprenticeship, 2026 to present. What LLM agents can and can't do in security reasoning, from binary exploitation to CTF challenges.</desc>
