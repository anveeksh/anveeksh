<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Projects</title>
  <desc id="d">CrimeSentinel: online safety and multilingual NLP. Detects criminal recruitment and glorification content on TikTok and YouTube. Python, TF-IDF, Random Forest, XGBoost, BETO, XLM-RoBERTa. PhishGuard: phishing detection. Flags phishing URLs by combining feature extraction with rule-based and ML-assisted risk scoring. Python, scikit-learn, Random Forest, XGBoost, FastAPI. SEQR: usable security and risk communication. How people respond to security information when a QR code's destination can't be classified.</desc>
