<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
  <title id="t">Anveeksh Mahesh Rao: profile overview</title>
  <desc id="d">Research question: how can security systems help people decide well when the threat, the risk, or the system is uncertain? Status: open to internships and roles; MS Cybersecurity at Northeastern, April 2027. Now: Graduate Student Researcher at the Civic A.I. Lab, and AI-assisted security research on LLM agents. Focus: human-centered security, phishing and social engineering, warnings and risk communication, privacy. Teaching: 5,000+ people trained, 10+ universities, 30+ organizations.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
    .label { font-size: 15px; fill: #7E93BA; letter-spacing: .2px; }
    .h { font-size: 20px; fill: #EAF3FF; font-weight: 600; }
    .b { font-size: 16px; fill: #B4C6E6; }
    .m { font-size: 15px; fill: #7E93BA; }
    .tile { fill: #0F1F44; stroke: #1E3A70; stroke-width: 1.5; }
    .cursor { animation: hesitate 7s ease-in-out infinite; }
    @keyframes hesitate {
      0%, 14%   { transform: translate(0px, 0px); }
      32%, 50%  { transform: translate(98px, 2px); }
      64%, 72%  { transform: translate(16px, -2px); }
      88%, 100% { transform: translate(0px, 0px); }
    }
    .live { animation: pulse 2.4s ease-in-out infinite; transform-origin: 857px 106px; }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(2.2); } }
    @media (prefers-reduced-motion: reduce) { .cursor, .live { animation: none; } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="1200" height="700" rx="18"/></clipPath>
    <filter id="glow" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#3CD2F0" stop-opacity="0"/><stop offset=".2" stop-color="#3CD2F0"/>
      <stop offset=".8" stop-color="#3CD2F0"/><stop offset="1" stop-color="#3CD2F0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" rx="18" fill="#0A1530"/>
  <g clip-path="url(#frame)">
    <rect x="120" y="0" width="960" height="3" fill="url(#neon)" filter="url(#glow)" opacity=".9"/>
    <rect x="120" y="0" width="960" height="2" fill="url(#neon)"/>
  </g>

  <!-- Research question with the warning that can't decide -->
  <rect class="tile" x="24" y="24" width="776" height="320" rx="14"/>
  <text class="sans label" x="56" y="64">Research question</text>
  <text class="serif" font-size="27" fill="#EAF3FF">
    <tspan x="56" y="124">How can security systems</tspan>
    <tspan x="56" y="162">help people decide well</tspan>
    <tspan x="56" y="200">when the threat, the risk,</tspan>
    <tspan x="56" y="238">or the system is uncertain?</tspan>
  </text>

  <rect x="436" y="64" width="340" height="244" rx="12" fill="#13295A" stroke="#2A4C8A" stroke-width="1.5"/>
  <rect x="452" y="80" width="308" height="26" rx="13" fill="#0A1530"/>
  <text class="sans" x="468" y="98" font-size="13" fill="#7E93BA">parking-pay.link/verify</text>
  <path d="M484 128 L500 155 L468 155 Z" fill="#FF5A66" stroke="#FF5A66" stroke-width="4" stroke-linejoin="round"/>
  <rect x="482.6" y="135" width="2.8" height="10" rx="1.4" fill="#13295A"/>
  <circle cx="484" cy="149.5" r="1.8" fill="#13295A"/>
  <text class="sans" x="512" y="150" font-size="18" font-weight="600" fill="#EAF3FF">This link may be unsafe</text>
  <text class="sans" x="452" y="190" font-size="15" fill="#B4C6E6">We couldn't verify where this link goes.</text>
  <text class="sans" x="452" y="211" font-size="15" fill="#B4C6E6">It may be safe. It may not.</text>
  <rect x="452" y="240" width="104" height="38" rx="8" fill="#3CD2F0"/>
  <text class="sans" x="504" y="264" font-size="15" font-weight="600" fill="#06213A" text-anchor="middle">Go back</text>
  <rect x="568" y="240" width="152" height="38" rx="8" fill="none" stroke="#3A5C99" stroke-width="1.5"/>
  <text class="sans" x="644" y="264" font-size="15" fill="#B4C6E6" text-anchor="middle">Continue anyway</text>
  <g transform="translate(546 268)">
    <g class="cursor">
      <path d="M0 0 L0 22 L5.5 17 L9.6 25.6 L13.3 24 L9.2 15.6 L16 15.2 Z" fill="#FFFFFF" stroke="#0A1530" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Status -->
  <rect class="tile" x="820" y="24" width="356" height="320" rx="14"/>
  <text class="sans label" x="852" y="64">Status</text>
  <circle class="live" cx="857" cy="106" r="7" fill="#35D49A"/>
  <circle cx="857" cy="106" r="6" fill="#35D49A"/>
  <text class="sans h" x="874" y="113">Open to opportunities</text>
  <text class="sans b" x="852" y="146">Research internships and roles in</text>
  <text class="sans b" x="852" y="168">usable security, privacy, AI security,</text>
  <text class="sans b" x="852" y="190">security engineering, and GRC</text>
  <line x1="852" y1="222" x2="1144" y2="222" stroke="#1E3A70" stroke-width="1.5"/>
  <text class="sans h" x="852" y="262">MS Cybersecurity, April 2027</text>
  <text class="sans b" x="852" y="288">Northeastern University</text>
  <text class="sans m" x="852" y="312">Khoury College, Boston</text>

  <!-- Now -->
  <rect class="tile" x="24" y="364" width="370" height="312" rx="14"/>
  <text class="sans label" x="56" y="404">Now</text>
  <text class="sans h" x="56" y="444">Civic A.I. Lab, Northeastern</text>
  <text class="sans m" x="56" y="468">Graduate Student Researcher, 2026–</text>
  <text class="sans b" x="56" y="496">Detecting criminal recruitment</text>
  <text class="sans b" x="56" y="518">content on TikTok and YouTube</text>
  <line x1="56" y1="546" x2="362" y2="546" stroke="#1E3A70" stroke-width="1.5"/>
  <text class="sans h" x="56" y="584">AI-assisted security</text>
  <text class="sans b" x="56" y="612">How LLM agents perform on binary</text>
  <text class="sans b" x="56" y="634">exploitation and CTF challenges</text>

  <!-- Focus -->
  <rect class="tile" x="415" y="364" width="370" height="312" rx="14"/>
  <text class="sans label" x="447" y="404">Focus</text>
  <g class="sans" font-size="18" fill="#EAF3FF">
    <rect x="447" y="438" width="10" height="10" rx="2" fill="#3CD2F0"/><text x="471" y="448">Human-centered security</text>
    <rect x="447" y="496" width="10" height="10" rx="2" fill="#3CD2F0"/><text x="471" y="506">Phishing and social engineering</text>
    <rect x="447" y="554" width="10" height="10" rx="2" fill="#3CD2F0"/><text x="471" y="564">Warnings and risk communication</text>
    <rect x="447" y="612" width="10" height="10" rx="2" fill="#3CD2F0"/><text x="471" y="622">Privacy and PETs</text>
  </g>

  <!-- Teaching -->
  <rect class="tile" x="806" y="364" width="370" height="312" rx="14"/>
  <text class="sans label" x="838" y="404">Teaching</text>
  <g class="sans">
    <text x="838" y="458" font-size="34" font-weight="600" fill="#EAF3FF">5,000+</text>
    <text x="984" y="456" font-size="17" fill="#B4C6E6">people trained</text>
    <text x="838" y="520" font-size="34" font-weight="600" fill="#EAF3FF">10+</text>
    <text x="984" y="518" font-size="17" fill="#B4C6E6">universities</text>
    <text x="838" y="582" font-size="34" font-weight="600" fill="#EAF3FF">30+</text>
    <text x="984" y="580" font-size="17" fill="#B4C6E6">organizations</text>
  </g>
  <text class="sans m" x="838" y="634">Guest lectures and training since 2022</text>
