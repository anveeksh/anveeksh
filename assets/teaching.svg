  <title id="t">Teaching and leadership</title>
  <desc id="d">Founder, Cyber Tech Associates, 2020 to present: cybersecurity education and consulting, including technical training, awareness programs, digital forensics workshops, and mentoring. Certified Cybersecurity Trainer, Skill India. 2022 to 2025: corporate and government cybersecurity trainer in India. 2023 to 2025: guest lecturer in IoT and cybersecurity, Alva's Institute of Engineering and Technology. 2023 to present: guest lecturer in digital and cyber forensics, Srinivas University. 2025: faculty development program, South India Education Trust, with ExcelR and CyberFrat.</desc>
